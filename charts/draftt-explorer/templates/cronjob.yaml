{{- with .Values.appConfig.localMode }}
{{- if .enabled }}
{{- fail "local mode is not supported by draftt-explorer 2.0.0; remove appConfig.localMode and use API mode" }}
{{- end }}
{{- end }}
{{- if and (hasKey .Values.appConfig.api "enabled") (not .Values.appConfig.api.enabled) }}
{{- fail "draftt-explorer 2.0.0 is API-only; remove appConfig.api.enabled or set it to true" }}
{{- end }}
{{- $baseAPIEndpoint := include "draftt-k8s-explorer.apiBaseUrl" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "draftt-k8s-explorer.fullname" . }}
  namespace: {{ .Values.appConfig.namespace | default .Release.Namespace }}
  labels:
    {{- include "draftt-explorer.labels" . | nindent 4 }}
    {{- with .Values.cronjob.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.cronjob.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "draftt-explorer.labels" . | nindent 12 }}
            {{- with .Values.cronjob.labels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.cronjob.annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "draftt-k8s-explorer.serviceAccountName" . }}
          containers:
            - name: draftt-k8s-explorer
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              env:
                - name: DRAFTT_COMPONENT_IDENTIFIER
                  value: {{ tpl .Values.appConfig.clusterIdentifier . | quote }}
                - name: DRAFTT_BASE_API_ENDPOINT
                  value: {{ $baseAPIEndpoint | quote }}
                - name: DRAFTT_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.appConfig.api.drafttApiToken.secretName | quote }}
                      key: {{ .Values.appConfig.api.drafttApiToken.secretKey | quote }}
                {{- with .Values.appConfig.logLevel }}
                - name: LOG_LEVEL
                  value: {{ . | quote }}
                {{- end }}
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          {{- with .Values.cronjob.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjob.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjob.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
